<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bar Register</title>
<style>
  :root{
    --bg: #14110f;
    --bg-elev: #1c1815;
    --bg-card: #211c18;
    --line: #34302a;
    --amber: #e8a64c;
    --amber-dim: #8a6a3a;
    --cream: #f3ead9;
    --cream-dim: #b8ad9c;
    --green: #6b9a6b;
    --red-ish: #b8654f;
    --radius: 14px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --mono: "SF Mono", "Menlo", monospace;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--cream); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; height:100%;}
  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(232,166,76,0.07), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(232,166,76,0.04), transparent 40%);
  }

  .app{ max-width: 720px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; }

  /* HEADER */
  header.top{
    position: sticky; top:0; z-index:30;
    background: rgba(20,17,15,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    padding: env(safe-area-inset-top) 18px 0 18px;
  }
  .top-inner{ padding: 14px 0 12px 0; }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between; gap: 10px;
  }
  .brand h1{
    font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: 0.01em;
    margin:0; color: var(--cream);
  }
  .brand h1 .accent{ color: var(--amber); font-style: italic; }
  .brand .count{ font-family: var(--mono); font-size: 12px; color: var(--cream-dim); white-space:nowrap; }

  .tabs{ display:flex; gap:8px; margin-top:14px; }
  .tab{
    flex:1; text-align:center; padding: 10px 4px; border-radius: 10px;
    border:1px solid var(--line); background: var(--bg-elev);
    font-size: 12.5px; font-weight:600; letter-spacing:0.005em; color: var(--cream-dim);
    transition: all .15s ease; cursor:pointer; user-select:none;
  }
  .tab .tab-sub{ display:block; font-size:10px; font-weight:500; color:var(--cream-dim); opacity:.7; margin-top:2px; letter-spacing:0.01em;}
  .tab.active{
    background: linear-gradient(180deg, rgba(232,166,76,0.18), rgba(232,166,76,0.07));
    border-color: var(--amber-dim); color: var(--amber);
  }
  .tab.active .tab-sub{ color: var(--amber); opacity:.85; }

  .search-row{ margin-top: 12px; position:relative; }
  .search-row input{
    width:100%; padding: 12px 40px 12px 38px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg-elev); color: var(--cream); font-size: 16px; font-family: var(--sans);
    outline: none;
  }
  .search-row input::placeholder{ color: var(--cream-dim); opacity:.6; }
  .search-row input:focus{ border-color: var(--amber-dim); }
  .search-icon{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; opacity:.55;
  }
  .clear-btn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:50%; border:none; background:var(--bg-card);
    color:var(--cream-dim); font-size:14px; display:none; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .clear-btn.show{ display:flex; }

  .filter-row{
    display:flex; gap:8px; margin-top:10px; overflow-x:auto; padding-bottom:4px;
    scrollbar-width:none;
  }
  .filter-row::-webkit-scrollbar{ display:none; }
  .city-chip{
    flex:0 0 auto; padding:6px 13px; border-radius:999px; border:1px solid var(--line);
    background:var(--bg-elev); color:var(--cream-dim); font-size:12.5px; font-weight:500;
    white-space:nowrap; cursor:pointer; user-select:none; transition: all .12s ease;
  }
  .city-chip.active{ background:var(--amber); color:#1c140a; border-color:var(--amber); font-weight:700; }

  /* LIST */
  main{ flex:1; padding: 14px 18px 100px 18px; }
  .tab-note{
    font-size: 12.5px; color: var(--cream-dim); line-height:1.5;
    background: rgba(232,166,76,0.06); border:1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 4px;
  }
  .tab-note.hidden{ display:none; }
  .group-label{
    font-family: var(--mono); font-size: 11px; letter-spacing:0.12em; text-transform:uppercase;
    color: var(--amber-dim); margin: 22px 0 8px 2px;
  }
  .group-label:first-child{ margin-top:6px; }

  .card{
    background: var(--bg-card); border:1px solid var(--line); border-radius: var(--radius);
    padding: 13px 14px; margin-bottom: 9px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .card-main{ min-width:0; flex:1; }
  .card-name{
    font-family: var(--serif); font-size: 17px; font-weight:600; color: var(--cream);
    margin:0 0 3px 0; line-height:1.25;
  }
  .card-addr{
    font-size: 12.5px; color: var(--cream-dim); margin:0; line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card-company{
    font-size: 11px; color: var(--amber-dim); margin: 3px 0 0 0; font-style:italic;
  }
  .map-btn{
    flex:0 0 auto; width:42px; height:42px; border-radius:11px;
    background: rgba(232,166,76,0.1); border:1px solid var(--amber-dim);
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    color: var(--amber); transition: all .12s ease;
  }
  .map-btn:active{ background: rgba(232,166,76,0.25); transform: scale(0.95); }
  .map-btn svg{ width:19px; height:19px; }

  .empty-state{
    text-align:center; padding: 70px 20px; color: var(--cream-dim);
  }
  .empty-state .glyph{ font-size:30px; margin-bottom:10px; opacity:.5; }
  .empty-state p{ font-size:14px; margin:0; }

  footer.note{
    text-align:center; padding: 16px 20px 30px; font-size: 11px; color: var(--cream-dim); opacity:.55;
    font-family: var(--mono);
  }

  @media (min-width: 600px){
    .card-name{ font-size:18px; }
  }
</style>
</head>

let currentList = 1;
let activeCity = null;
let searchTerm = "";

const searchInput = document.getElementById('searchInput');

const tabBtn2 = document.getElementById('tabBtn2');

function mapsUrl(item){
  const parts = [item.name, item.street, item.city, item.postal, "Slovenija"].filter(Boolean);
  const q = encodeURIComponent(parts.join(', '));
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

function getCurrentData(){
  if (currentList === 1) return DATA1;
  if (currentList === 2) return DATA2;
  return DATA3;
}

function uniqueCities(data){
  const set = new Set();
  data.forEach(i => { if(i.city) set.add(i.city); });
  return Array.from(set).sort((a,b) => a.localeCompare(b, 'sl'));
}

function renderCityChips(){
  const data = getCurrentData();
  const cities = uniqueCities(data);
  cityFilterRow.innerHTML = '';

  const allChip = document.createElement('div');
  allChip.className = 'city-chip' + (activeCity === null ? ' active' : '');
  allChip.textContent = 'Vsa mesta';
  allChip.onclick = () => { activeCity = null; renderCityChips(); renderList(); };
  cityFilterRow.appendChild(allChip);

  cities.forEach(city => {
    const chip = document.createElement('div');
    chip.className = 'city-chip' + (activeCity === city ? ' active' : '');
    chip.textContent = city;
    chip.onclick = () => { activeCity = (activeCity === city ? null : city); renderCityChips(); renderList(); };
    cityFilterRow.appendChild(chip);
  });
}

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function cardHtml(item){
  const addrParts = [item.street, item.city + (item.postal ? ' ' + item.postal : '')].filter(Boolean);
  const addr = addrParts.join(', ');
  const companyLine = item.company ? `<p class="card-company">${escapeHtml(item.company)}</p>` : '';
  return `
    <div class="card">
      <div class="card-main">
        <p class="card-name">${escapeHtml(item.name)}</p>
        <p class="card-addr">${escapeHtml(addr)}</p>
        ${companyLine}
      </div>
      <a class="map-btn" href="${mapsUrl(item)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </a>
    </div>`;
}

function renderList(){
  const data = getCurrentData();
  const term = searchTerm.trim().toLowerCase();

  let filtered = data.filter(item => {
    if (activeCity && item.city !== activeCity) return false;
    if (term){
      const hay = [item.name, item.city, item.street, item.company].join(' ').toLowerCase();
      if (!hay.includes(term)) return false;
    }
    return true;
  });

  resultCount.textContent = filtered.length + (filtered.length === 1 ? ' lokal' : ' lokalov');

  if (filtered.length === 0){
    listContainer.innerHTML = `
      <div class="empty-state">
        <div class="glyph">🔍</div>
        <p>Ni najdenih lokalov za ta iskalni niz.</p>
      </div>`;
    return;
  }

  // group by city
  const grouped = {};
  filtered.forEach(item => {
    const key = item.city || 'Brez mesta';
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(item);
  });

  const cities = Object.keys(grouped).sort((a,b) => a.localeCompare(b, 'sl'));

  let html = '';
  cities.forEach(city => {
    const items = grouped[city].sort((a,b) => a.name.localeCompare(b.name, 'sl'));
    html += `<div class="group-label">${escapeHtml(city)} · ${items.length}</div>`;
    items.forEach(item => { html += cardHtml(item); });
  });

  listContainer.innerHTML = html;
}

const TAB_NOTES = {
  1: "",
  2: "",
  3: "Lokali, ki se pojavijo v obeh seznamih: na seznamu A &amp; B lokalov in na seznamu lokalov brez vnesenega menija."
};

function switchTab(n){
  currentList = n; activeCity = null;
  Object.keys(tabBtns).forEach(k => tabBtns[k].classList.toggle('active', Number(k) === n));
  const note = TAB_NOTES[n];
  tabNote.innerHTML = note;
  tabNote.classList.toggle('hidden', !note);
  renderCityChips(); renderList();
}
tabBtn1.onclick = () => switchTab(1);
tabBtn2.onclick = () => switchTab(2);
tabBtn3.onclick = () => switchTab(3);
tabNote.classList.add('hidden');

searchInput.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  clearBtn.classList.toggle('show', searchTerm.length > 0);
  renderList();
});
clearBtn.onclick = () => {
  searchInput.value = '';
  searchTerm = '';
  clearBtn.classList.remove('show');
  renderList();
  searchInput.focus();
};

renderCityChips();
renderList();
</script>
</body>
</html>
